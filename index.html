<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamsOfNeptune</title>
  
  <!-- Tipografía cinemática / metalera -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PANTALLA DE ACCESO (LOGIN / REGISTRO) -->
  <div id="login-screen" class="screen">
    
    <!-- Caja de Iniciar Sesión -->
    <div id="login-box" class="auth-box">
      <h1 class="brand-title">DreamsOfNeptune</h1>
      <p class="brand-subtitle">Interactive Hub</p>

      <form id="login-form">
        <div class="input-group">
          <label for="username">Correo Electrónico</label>
          <input type="email" id="username" required placeholder="tu@correo.com" autocomplete="email">
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Ingresar</button>
        <p id="login-error" class="error-msg hidden"></p>
      </form>

      <p class="switch-text">
        ¿No tienes acceso? <a href="#" id="to-register">Crear Cuenta</a>
      </p>
    </div>

    <!-- Caja de Registro -->
    <div id="register-box" class="auth-box hidden">
      <h1 class="brand-title">DreamsOfNeptune</h1>
      <p class="brand-subtitle">Registro de Usuario</p>

      <form id="register-form">
        <div class="input-group">
          <label for="reg-email">Correo Electrónico</label>
          <input type="email" id="reg-email" required placeholder="tu@correo.com" autocomplete="email">
        </div>
        <div class="input-group">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" required placeholder="••••••••" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary">Registrarse</button>
        <p id="reg-error" class="error-msg hidden"></p>
      </form>

      <p class="switch-text">
        ¿Ya tienes cuenta? <a href="#" id="to-login">Iniciar Sesión</a>
      </p>
    </div>

  </div>

  <!-- PANTALLA DEL CATÁLOGO DE JUEGOS -->
  <div id="catalog-screen" class="screen hidden">
    <header class="catalog-header">
      <div class="header-brand">
        <h2>DreamsOfNeptune</h2>
      </div>
      <div class="user-info">
        <span id="user-display">cargando...</span>
        <button id="logout-btn" class="btn-secondary">Cerrar Sesión</button>
      </div>
    </header>

    <main class="catalog-content">
      <h3 class="section-title">Catálogo de Juegos</h3>
      
      <div class="games-grid">
        <!-- Tarjeta del juego Asteroid Shooter -->
        <div class="game-card">
          <div class="game-preview">
            <span class="game-badge">Godot 4</span>
          </div>
          <div class="game-details">
            <h4>Asteroid Shooter</h4>
            <p>Destruye asteroides y sobrevive en el espacio profundo.</p>
            <a href="games/asteroid-shooter/index.html" class="btn-play">Jugar Ahora</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
